drift:
  # A push is STALE when the latest main commit is newer than the last known live stamp.
  # No grace period: any post-deploy commit is flagged, with the exact gap shown so the
  # operator can judge (43s gaps from computedAt-only refreshes look different from real drift).
  stale_pr_days: 14
